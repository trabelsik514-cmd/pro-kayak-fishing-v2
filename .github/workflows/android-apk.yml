name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Prepare app branding assets
        run: |
          mkdir -p assets
          cp public/brand/file_00000000540c820abaeb6846e360276e.png assets/icon.png
          cp public/brand/file_00000000540c820abaeb6846e360276e.png assets/splash.png
      - name: Generate Android app icon and splash assets
        run: npx @capacitor/assets@3.0.5 generate --android --assetPath assets --iconBackgroundColor '#edf5fa' --iconBackgroundColorDark '#edf5fa' --splashBackgroundColor '#edf5fa' --splashBackgroundColorDark '#edf5fa'
      - name: Configure background runner Android AAR repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          content = gradle_file.read_text()
          required = "dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'"
          if required not in content:
              pattern = r"(dirs\s+['\"]\.\./capacitor-cordova-android-plugins/src/main/libs['\"],\s*['\"]libs['\"])"
              updated, count = re.subn(pattern, r"\1\n            " + required, content, count=1)
              if count != 1:
                  raise SystemExit("Could not find the expected flatDir repository in android/app/build.gradle")
              gradle_file.write_text(updated)
          aar = Path("node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar")
          if not aar.is_file():
              raise SystemExit(f"Required background-runner AAR is missing: {aar}")
          print(f"Found background-runner AAR: {aar}")
          PY
      - name: Build Android debug APK
        run: npm run android:build
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pro-kayak-fishing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
