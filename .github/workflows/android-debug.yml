name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    env:
      APP_BUILD_CHANNEL: debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare app branding
        run: |
          mkdir -p assets
          cp public/brand/file_00000000540c820abaeb6846e360276e.png assets/icon.png
          cp public/brand/file_00000000540c820abaeb6846e360276e.png assets/splash.png

      - name: Generate Android app icon and splash assets
        run: npx @capacitor/assets@3.0.5 generate --android --assetPath assets --iconBackgroundColor '#edf5fa' --iconBackgroundColorDark '#edf5fa' --splashBackgroundColor '#edf5fa' --splashBackgroundColorDark '#edf5fa'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Provide Background Runner Android JS engine
        run: |
          mkdir -p android/app/libs
          cp node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar android/app/libs/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pro-kayak-fishing-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# APK artifact upload is required for every Android build.

# APK build trigger: 2026-10-08T21:30Z
