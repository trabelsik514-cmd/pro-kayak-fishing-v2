name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare app branding
        run: |
          mkdir -p assets
          cp public/brand/file_00000000540c820abaeb6846e360276e.png assets/logo.png

      - name: Generate Android app icon and splash assets
        run: npx @capacitor/assets@3.0.5 generate --android --assetPath assets --iconBackgroundColor '#07141f' --iconBackgroundColorDark '#07141f' --splashBackgroundColor '#07141f' --splashBackgroundColorDark '#07141f'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-kayak-fishing-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
